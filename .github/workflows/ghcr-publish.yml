name: Package WebGL source candidate to GHCR
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact clean same-repository dev PR head SHA
        required: true
        type: string
      source_pr:
        description: Same-repository PR to dev authorizing candidate source
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ghcr-candidate
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'long2know/mahjong-web' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: publisher
          persist-credentials: false
      - name: Validate publishing contracts
        run: python3 -B publisher/tests/migration/test_ghcr_publish.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify clean exact same-repository source (no prebuilt player inputs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_ROOT: ${{ github.workspace }}/source
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_PR: ${{ inputs.source_pr }}
        run: python3 -B publisher/scripts/ghcr_publish.py prepare
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build source candidate; never move latest or legacy aliases
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./source
          file: ./source/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          tags: |
            ghcr.io/long2know/mahjong-web:candidate-${{ github.run_id }}-${{ github.run_attempt }}
            ghcr.io/long2know/mahjong-web:sha-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/long2know/mahjong-web
            org.opencontainers.image.revision=${{ inputs.source_sha }}
          build-args: BUILD_SHA=${{ inputs.source_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Locked browser tooling if absent
        working-directory: source
        run: |
          node -e "require('./src/frontend/autotable-src/node_modules/@playwright/test')" \
            || npm ci --prefix src/frontend/autotable-src --no-audit --no-fund
      - name: Check exact published digest at root and behind nginx TLS
        id: runtime
        working-directory: source
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          IMAGE="ghcr.io/long2know/mahjong-web@${DIGEST}"
          docker pull --platform linux/amd64 "$IMAGE"
          python3 -B tests/migration/container_smoke.py --image "$IMAGE" --source-sha "$SOURCE_SHA"
          python3 -B tests/migration/container_proxy_smoke.py --image "$IMAGE" --source-sha "$SOURCE_SHA"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          printf 'image=%s\nimage_id=%s\n' "$IMAGE" "$IMAGE_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: candidate-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            source/artifacts/test-results/web-container/receipt.json
            source/artifacts/base-url/hosted-nginx/receipt.json
            source/artifacts/base-url/hosted-nginx/*/browser.log
            source/artifacts/base-url/hosted-nginx/*/*.log
            source/artifacts/base-url/hosted-nginx-*/receipt.json
            source/artifacts/base-url/hosted-nginx-*/mounted-game-progressed.png
            source/artifacts/base-url/hosted-nginx-*/failure.png
      - name: Record runtime-checked candidate identity (independent acceptance required)
        env:
          IMAGE: ${{ steps.runtime.outputs.image }}
          IMAGE_ID: ${{ steps.runtime.outputs.image_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          printf 'Candidate: `%s`\nImage ID: `%s`\nSource: `%s`\nLinux/amd64 root and nginx TLS runtime checks passed.\nIndependent digest acceptance and protected promotion are still required.\nNo latest or legacy alias moved.\n' \
            "$IMAGE" "$IMAGE_ID" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
