name: Package WebGL source candidate to GHCR
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact clean same-repository dev PR head SHA
        required: true
        type: string
      source_pr:
        description: Same-repository PR to dev authorizing candidate source
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ghcr-candidate
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'long2know/mahjong-web' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: publisher
          persist-credentials: false
      - name: Validate publishing contracts
        run: python3 -B publisher/tests/migration/test_ghcr_publish.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify clean exact same-repository source (no prebuilt player inputs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_ROOT: ${{ github.workspace }}/source
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_PR: ${{ inputs.source_pr }}
        run: python3 -B publisher/scripts/ghcr_publish.py prepare
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build source candidate; never move latest or legacy aliases
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./source
          file: ./source/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          tags: |
            ghcr.io/long2know/mahjong-web:candidate-${{ github.run_id }}-${{ github.run_attempt }}
            ghcr.io/long2know/mahjong-web:sha-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/long2know/mahjong-web
            org.opencontainers.image.revision=${{ inputs.source_sha }}
          build-args: BUILD_SHA=${{ inputs.source_sha }}
      - name: Record candidate identity (not runtime acceptance)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          printf 'Candidate: `ghcr.io/long2know/mahjong-web@%s`\nSource: `%s`\nNo latest or legacy alias moved.\n' \
            "$DIGEST" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
