name: Source migration and licensed Unity qualification

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      build_unity:
        description: Run actual tests/Web build on an approved, privately licensed runner
        type: boolean
        default: false
      allow_source_dirty:
        description: Explicit local qualification only, never a release/integrity bypass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Pinned import, 33 backend tool, 9 source/context and 1 player packaging contracts
        run: python3 tests/migration/run_source_ci.py source-tools --install-dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-source-tools
          if-no-files-found: error
          path: |
            artifacts/test-results/migration-ci/source-tools/receipt.json
            artifacts/test-results/migration-ci/source-tools/prerequisites.log
            artifacts/test-results/migration-ci/source-tools/shell-syntax.log
            artifacts/test-results/migration-ci/source-tools/baseline-init.log
            artifacts/test-results/migration-ci/source-tools/baseline-fetch.log
            artifacts/test-results/migration-ci/source-tools/baseline-proof.log
            artifacts/test-results/migration-ci/source-tools/backend-tools.log
            artifacts/test-results/migration-ci/source-tools/source-gates.log
            artifacts/test-results/migration-ci/source-tools/player-packaging.log
            artifacts/test-results/migration-ci/source-tools/missing-unity-artifact.log

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: false
      - name: 147 focused compatibility, room/relay/continuation and hosting tests; real API publish
        run: python3 tests/migration/run_source_ci.py backend --install-dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-compatibility
          if-no-files-found: error
          path: |
            artifacts/test-results/migration-ci/backend/receipt.json
            artifacts/test-results/migration-ci/backend/prerequisites.log
            artifacts/test-results/migration-ci/backend/dependencies.log
            artifacts/test-results/migration-ci/backend/backend-tests.log
            artifacts/test-results/migration-ci/backend/api-publish.log
            artifacts/test-results/migration-ci/backend/backend.trx

  frontend-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          package-manager-cache: false
      - name: 80 browser/caller tests, 6 renderer regressions, strict typecheck and Vite (not player qualification)
        run: python3 tests/migration/run_source_ci.py frontend-source --install-dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-source-compatibility
          if-no-files-found: error
          path: |
            artifacts/test-results/migration-ci/frontend-source/receipt.json
            artifacts/test-results/migration-ci/frontend-source/prerequisites.log
            artifacts/test-results/migration-ci/frontend-source/dependencies.log
            artifacts/test-results/migration-ci/frontend-source/workflow-contracts.log
            artifacts/test-results/migration-ci/frontend-source/frontend-tests.log
            artifacts/test-results/migration-ci/frontend-source/renderer-regressions.log
            artifacts/test-results/migration-ci/frontend-source/typecheck.log
            artifacts/test-results/migration-ci/frontend-source/vite-build.log
            src/frontend/autotable/renderer-module-graph.json

  unity-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: false
      - name: Asset metadata, frozen source contract, 5 JS tests and 26-file C#9 syntax ONLY
        run: python3 tests/migration/run_source_ci.py unity-source --install-dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unity-source-syntax-not-editor
          if-no-files-found: error
          path: |
            artifacts/test-results/migration-ci/unity-source/receipt.json
            artifacts/test-results/migration-ci/unity-source/prerequisites.log
            artifacts/test-results/migration-ci/unity-source/asset-metadata.log
            artifacts/test-results/migration-ci/unity-source/source-contract.log
            artifacts/test-results/migration-ci/unity-source/bridge-tests.log
            artifacts/test-results/migration-ci/unity-source/dependencies.log
            artifacts/test-results/migration-ci/unity-source/syntax-build.log
            artifacts/test-results/migration-ci/unity-source/csharp-syntax.log

  licensed-unity:
    if: github.event_name == 'workflow_dispatch' && inputs.build_unity
    needs: [source-tools, backend, frontend-source, unity-source]
    runs-on: [self-hosted, linux, x64, unity-6000.3.24f1]
    environment: licensed-unity-build
    env:
      UNITY_LICENSE_FILE: ${{ vars.UNITY_LICENSE_FILE }}
      UNITY_LICENSE_DIR: ${{ vars.UNITY_LICENSE_DIR }}
      ALLOW_SOURCE_DIRTY: ${{ inputs.allow_source_dirty && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Privately provisioned licensing, actual tests/build and separate runtime image
        run: bash build.sh --tag mahjong-unity:qualification
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: actual-unity-webgl
          path: artifacts/unity-webgl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: actual-unity-editor-tests
          path: artifacts/test-results/unity-*
          if-no-files-found: warn
