name: Mahjong Web source and runtime image
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ghcr-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -B tests/migration/test_ghcr_publish.py
  source-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -B tests/migration/run_source_ci.py source-tools --install-dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: web-source-tools
          if-no-files-found: error
          path: |
            artifacts/test-results/web-source/source-tools/receipt.json
            artifacts/test-results/web-source/source-tools/shell-syntax.log
            artifacts/test-results/web-source/source-tools/build-wrappers.log
            artifacts/test-results/web-source/source-tools/source-delivery.log
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"
          cache: false
      - run: python3 -B tests/migration/run_source_ci.py backend --install-dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: web-backend
          if-no-files-found: error
          path: |
            artifacts/test-results/web-source/backend/receipt.json
            artifacts/test-results/web-source/backend/dependencies.log
            artifacts/test-results/web-source/backend/backend-tests.log
            artifacts/test-results/web-source/backend/api-publish.log
            artifacts/test-results/web-source/backend/backend.trx
  frontend-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
          package-manager-cache: false
      - run: python3 -B tests/migration/run_source_ci.py frontend-source --install-dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: web-browser-source
          if-no-files-found: error
          path: |
            artifacts/test-results/web-source/frontend-source/receipt.json
            artifacts/test-results/web-source/frontend-source/dependencies.log
            artifacts/test-results/web-source/frontend-source/workflow-contracts.log
            artifacts/test-results/web-source/frontend-source/frontend-tests.log
            artifacts/test-results/web-source/frontend-source/renderer-regressions.log
            artifacts/test-results/web-source/frontend-source/typecheck.log
            artifacts/test-results/web-source/frontend-source/vite-build.log
            src/frontend/autotable/renderer-module-graph.json
            src/frontend/autotable/web-build.json
  image-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build exact-source image locally; no registry publication
        run: docker build --build-arg BUILD_SHA="$(git rev-parse HEAD)" --tag mahjong-web:ci .
      - name: Isolated hardened synthetic runtime and real static-artifact smoke
        run: python3 -B tests/migration/container_smoke.py --image mahjong-web:ci --source-sha "$(git rev-parse HEAD)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Locked browser tooling if absent
        id: browser_tooling
        run: |
          node -e "require('./src/frontend/autotable-src/node_modules/@playwright/test')" \
            || npm ci --prefix src/frontend/autotable-src --no-audit --no-fund
      - name: Test-only input trace contracts
        id: trace_contracts
        run: |
          mkdir -p artifacts/runtime-input-trace
          node --test --test-reporter=tap tests/migration/browser-input-trace.test.mjs \
            > artifacts/runtime-input-trace/trace-contracts.log 2>&1 \
            || { cat artifacts/runtime-input-trace/trace-contracts.log; exit 1; }
      - name: Actual nginx TLS mount-prefix browser and transport proof
        run: python3 -B tests/migration/container_proxy_smoke.py --image mahjong-web:ci --source-sha "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: web-image-runtime
          if-no-files-found: error
          path: |
            artifacts/test-results/web-container/receipt.json
            artifacts/base-url/hosted-nginx/receipt.json
            artifacts/base-url/hosted-nginx/*/browser.log
            artifacts/base-url/hosted-nginx/*/*.log
            artifacts/base-url/hosted-nginx-*/receipt.json
            artifacts/base-url/hosted-nginx-*/mounted-game-progressed.png
            artifacts/base-url/hosted-nginx-*/failure.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: web-input-trace
          if-no-files-found: error
          path: |
            artifacts/runtime-input-trace/trace-contracts.log
            artifacts/runtime-input-trace/canonical/hosted-nginx-*/input-trace.json
