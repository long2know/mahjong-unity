name: Qualify exact published polish candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polish-runtime-ee58678
  cancel-in-progress: false

jobs:
  runtime:
    if: github.repository == 'long2know/mahjong-unity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [general, focus, camera, relay, mobile]
    permissions:
      # Required only to read the unpublished draft input release.
      contents: write
      pull-requests: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ee58678676bc3f99ac141a27111922dc3110ab2e
          path: source
          persist-credentials: false
      - name: Restore genuine WebGL inputs and original Editor receipt/XML and case plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_ROOT: ${{ github.workspace }}/source
          SOURCE_SHA: ee58678676bc3f99ac141a27111922dc3110ab2e
          SOURCE_PR: "21"
          RELEASE_ID: "431007157"
          ASSET_ID: "700226136"
          BUNDLE_SHA256: bdec288a7ab1b8c5346ca8e38e93dcf17a3fac66ccd65d7a1c6af8967c007172
        run: |
          python3 -B publisher/scripts/ghcr_publish.py prepare
          python3 -B publisher/scripts/qualify-polish-candidate.py prepare
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Build exact-source Vite reference and stage unchanged genuine Unity files
        working-directory: source
        env:
          BUILD_SHA: ee58678676bc3f99ac141a27111922dc3110ab2e
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NPM_CONFIG_CACHE: ${{ github.workspace }}/source/artifacts/hosted-npm-cache
        run: |
          npm ci --prefix src/frontend/autotable-src --no-audit --no-fund
          npm run build --prefix src/frontend/autotable-src
          python3 - <<'PY'
          import shutil
          shutil.copytree("artifacts/unity-webgl", "src/frontend/autotable/unity", dirs_exist_ok=True)
          PY
      - name: Run unchanged actual CSharp/server/browser partition on the immutable candidate
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source
          PARTITION: ${{ matrix.group }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends acl
          python3 -B publisher/scripts/qualify-polish-candidate.py qualify --group "$PARTITION"
      - name: Retain actual raw receipts, logs, screenshots and failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polish-runtime-ee58678-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/artifacts/test-results/
          if-no-files-found: error
          retention-days: 30
