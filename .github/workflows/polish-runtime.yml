name: Qualify exact published polish candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polish-runtime-0dae531
  cancel-in-progress: false

jobs:
  runtime:
    if: github.repository == 'long2know/mahjong-unity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [general, focus, camera, relay, mobile]
    permissions:
      # Required only to read the unpublished draft input release.
      contents: write
      pull-requests: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0dae531a58d87548488d76a55297700d5ff3589c
          path: source
          persist-credentials: false
      - name: Restore genuine WebGL inputs and original Editor receipt/XML and case plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_ROOT: ${{ github.workspace }}/source
          SOURCE_SHA: 0dae531a58d87548488d76a55297700d5ff3589c
          SOURCE_PR: "21"
          RELEASE_ID: "430946697"
          ASSET_ID: "699921814"
          BUNDLE_SHA256: ff7b561d4067e31937162b193c414aaa614fd94a083391151cc52b13d97c6eb2
        run: |
          python3 -B publisher/scripts/ghcr_publish.py prepare
          python3 -B publisher/scripts/qualify-polish-candidate.py prepare
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Build exact-source Vite reference and stage unchanged genuine Unity files
        working-directory: source
        env:
          BUILD_SHA: 0dae531a58d87548488d76a55297700d5ff3589c
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NPM_CONFIG_CACHE: ${{ github.workspace }}/source/artifacts/hosted-npm-cache
        run: |
          npm ci --prefix src/frontend/autotable-src --no-audit --no-fund
          npm run build --prefix src/frontend/autotable-src
          python3 - <<'PY'
          import shutil
          shutil.copytree("artifacts/unity-webgl", "src/frontend/autotable/unity", dirs_exist_ok=True)
          PY
      - name: Run unchanged actual CSharp/server/browser partition on the immutable candidate
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source
          PARTITION: ${{ matrix.group }}
        run: python3 -B publisher/scripts/qualify-polish-candidate.py qualify --group "$PARTITION"
      - name: Retain actual raw receipts, logs, screenshots and failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polish-runtime-0dae531-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/artifacts/test-results/
          if-no-files-found: error
          retention-days: 30
